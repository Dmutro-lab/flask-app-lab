
{% extends "base.html" %}

{% block title %}Мій обліковий запис{% endblock %}

{% block content %}

<div class="container mt-4 mb-5" style="max-width: 700px;">

    <h2 class="mb-4 text-center">Мій обліковий запис</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <h4 class="card-title mb-4">
                Вітаємо, {{ user.username }}!
            </h4>

            <p>
                <strong>Ім'я користувача:</strong>
                {{ user.username }}
            </p>

            <p>
                <strong>Електронна пошта:</strong>
                {{ user.email }}
            </p>

            <p>
                <strong>ID користувача:</strong>
                {{ user.id }}
            </p>

            <a href="{{ url_for('users.profile') }}" class="btn btn-primary">
                Перейти до профілю
            </a>

            <form method="POST" action="{{ url_for('users.logout') }}" class="mt-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <button type="submit" class="btn btn-outline-danger">
                    Вийти із системи
                </button>
            </form>

        </div>
    </div>

</div>

{% endblock %}
