
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Flask Lab 3{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">

            <div class="header-brand">
                <h1>Flask Application</h1>
                <p>Лабораторна робота №3 — Blueprints</p>
            </div>

            <nav class="main-nav">
                <a href="{{ url_for('index') }}">Резюме</a>
                <a href="{{ url_for('contacts') }}">Контакти</a>
                <a href="{{ url_for('home') }}">Головна</a>
                <a href="{{ url_for('users.greetings', name='John', age=30) }}">Users</a>
                <a href="{{ url_for('products.product_list') }}">Products</a>
            </nav>

        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Івасюк Дмитро | Лабораторна робота №3</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
